<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>实时多账号客服聊天系统</title>
    <link rel="stylesheet" href="__PUBLIC__/kefu/bootstrap.min.css">
    <link rel="stylesheet" href="__PUBLIC__/kefu/font-awesome.min.css">
    <style>
        /* 基础样式 */
        .chat-container {
            height: calc(100vh - 120px);
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }
        
        /* 左侧账号列表样式 */
        .accounts-sidebar {
            width: 200px;
            border-right: 1px solid #ddd;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
        }
        .accounts-header {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            font-weight: 500;
            background-color: #e9ecef;
        }
        .accounts-list {
            flex: 1;
            overflow-y: auto;
        }
        .account-item {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }
        .account-item:hover {
            background-color: #e9f5ff;
        }
        .account-item.active {
            background-color: #007bff;
            color: white;
        }
        .account-item.connected::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #28a745;
        }
        .account-info {
            flex: 1; /* 占满剩余空间，让未读徽章靠右显示 */
        }
        
        /* 账号号码样式 */
        .account-number {
            display: block;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-left: 10px; /* 与左侧连接状态点对齐 */
        }
        .account-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-left: 10px;
        }
        .account-unread {
            background-color: #dc3545;
            color: white;
            border-radius: 10px;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
        }
        
        /* 中间会话列表样式 */
        .sessions-container {
            width: 280px;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        .session-tabs {
            border-bottom: 1px solid #ddd;
        }
        .session-tabs .nav-tabs{ border-bottom:0px;}
        .session-list {
            flex: 1;
            overflow-y: auto;
        }
        
        /* 右侧聊天区域样式 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #f8f9fa;
        }
        .message-input {
            padding: 15px;
            border-top: 1px solid #ddd;
        }
        #messageInput {
            resize: none;
        }
        
        /* 会话项样式 */
        .session-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 5px;
        }
        .session-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
            object-fit: cover;
        }
        .session-info {
            flex: 1;
            overflow: hidden;
        }
        .session-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-desc {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .unread-badge {
            background-color: #dc3545;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-left: 5px;
        }
        
        /* 消息样式 */
        .message {
            margin-bottom: 15px;
            display: flex;
            max-width: 80%;
        }
        .message.incoming {
            flex-direction: row;
        }
        .message.outgoing {
            flex-direction: row-reverse;
            margin-left: auto;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-right: 10px;
            object-fit: cover;
        }
        .message.outgoing .message-avatar {
            margin-right: 0;
            margin-left: 10px;
        }
        .message-content {
            background-color: white;
            padding: 10px 15px;
            border-radius: 18px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .message.outgoing .message-content {
            background-color: #007bff;
            color: white;
        }
        .message-sender {
            font-size: 12px;
            margin-bottom: 5px;
            display: inline-block;
        }
        .message.outgoing .message-sender {
            display: none;
        }
        .message-meta {
            font-size: 11px;
            color: #999;
            text-align: right;
            margin-top: 5px;
        }
        .message.outgoing .message-meta {
            color: rgba(255,255,255,0.7);
        }
        .content {
            word-break: break-word;
        }
        .content a {
            color: #007bff;
            text-decoration: underline;
        }
        .message.outgoing .content a {
            color: #d1e7fe;
        }
        
        /* 加载提示样式 */
        .history-loading {
            color: #666;
            font-size: 14px;
            text-align: center;
            padding: 15px 0;
        }
        .no-history {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 30px 0;
        }
        .history-error {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            padding: 15px 0;
            cursor: pointer;
        }
        .load-more-tip {
            text-align: center;
            padding: 8px 0;
            color: #666;
            font-size: 12px;
        }
        
        /* 聊天头部 */
        .chat-header {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            background-color: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h5 {
            margin: 0;
        }
        .connection-status {
            font-size: 12px;
            display: flex;
            align-items: center;
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .status-online {
            background-color: #28a745;
        }
        .status-offline {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col">
                <h3>实时多账号客服聊天系统</h3>
            </div>
            <div class="col text-right">
                <div id="logoutBtn" >{$kefuinfo['username']}  退出</div>
            </div>
        </div>
        
        <div class="chat-container">
            <!-- 左侧账号列表 -->
            <div class="accounts-sidebar">
                <div class="accounts-header">所有账号</div>
                <div class="accounts-list" id="accountsList">
                    <!-- 账号列表将动态生成 -->
                </div>
            </div>
            
            <!-- 中间会话列表 -->
            <div class="sessions-container">
                <div class="session-tabs">
                    <ul class="nav nav-tabs w-100">
                        <li class="nav-item w-50 text-center">
                            <a class="nav-link active" data-type="groups">群组</a>
                        </li>
                        <li class="nav-item w-50 text-center">
                            <a class="nav-link" data-type="friends">私聊</a>
                        </li>
                    </ul>
                </div>
                <div class="session-list p-0">
                    <div id="groupsList" class="list-group p-2"></div>
                    <div id="friendsList" class="list-group p-2 d-none"></div>
                </div>
            </div>
            
            <!-- 右侧聊天区域 -->
            <div class="chat-area">
                <div class="chat-header" id="chatHeader">
                    <h5>请选择一个账号和会话</h5>
                    <div class="connection-status">
                        <span class="status-indicator status-offline" id="wsStatus"></span>
                        <span id="wsStatusText">未连接</span>
                    </div>
                </div>
                <div id="messageList" class="message-list"></div>
                <div class="message-input">
                    <div class="input-group">
                        <textarea id="messageInput" class="form-control" rows="2" placeholder="输入消息..."></textarea>
                        <div class="input-group-append">
                            <button id="sendBtn" class="btn btn-primary" disabled>发送</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="__PUBLIC__/kefu/jquery.min.js"></script>
    <script src="__PUBLIC__/kefu/bootstrap.min.js"></script>
    <script>
        // 全局状态管理
        let accounts = []; // 所有账号列表
        let currentAccount = null; // 当前选中的账号
        let currentSession = null; // 当前选中的会话
        let lastMsgId = 0; // 最后一条消息ID
        let currentUserId = 'unknown'; // 当前用户ID
        
        
        // WebSocket相关
        let socket = null;
        let isSocketConnected = false;
        let reconnectTimer = null;
        
        // 缓存管理
        const userInfoCache = {}; // {id: {name, avatar, unread, last_msg}}
        const groupInfoCache = {}; // {id: {title, avatar, unread, last_msg}}
        const accountDataCache = {}; // 缓存每个账号的数据 {accountId: {unread, hasNew}}
        
        // 历史消息加载状态
        let hasMoreHistory = true;
        let lastLoadedOffset = 0;
        let isLoadingHistory = false;

        // 初始化
        $(function() {
            // 加载所有账号
            loadAllAccounts();
            
            // 初始化WebSocket连接
            initWebSocket();
            
            // 切换群组/好友标签
            $('.nav-tabs a').click(handleTabSwitch);
            
            // 发送消息事件
            $('#sendBtn').click(sendMessage);
            $('#messageInput').keydown(handleInputKeydown);
            
            $('#logoutBtn').click(logout);
            // 消息列表滚动监听（加载更多历史消息）
            $('#messageList').scroll(handleMessageScroll);

            // 页面卸载时清理
            $(window).on('beforeunload', function() {
                if (socket) socket.close();
            });
        });

        // 初始化WebSocket连接
        function initWebSocket() {
            // 关闭已有连接
            if (socket) {
                socket.close();
            }

            // 更新连接状态UI
            updateWebSocketStatus(false);

            // WebSocket地址（根据实际后端地址修改）
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
           // const wsUrl = 'ws:/89.58.18.149:8282';
            try {
                // 创建连接
                socket = new WebSocket(wsUrl);
                
                // 连接成功
                socket.onopen = function() {
                    console.log('WebSocket连接成功');
                    isSocketConnected = true;
                    updateWebSocketStatus(true);
                    
                    // 清除重连计时器
                    if (reconnectTimer) {
                        clearTimeout(reconnectTimer);
                        reconnectTimer = null;
                    }
                    // 连接成功后，订阅当前账号的消息（如果已选择账号）
                    if (currentAccount) {
                        subscribeAccount(currentAccount.path);
                    }
                    // 订阅所有账号的未读更新
                    subscribeAllAccountsUnread();
                };
                
                // 接收消息
                socket.onmessage = function(event) {
                    console.log('所有WebSocket消息:', event.data);
                    try {
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    } catch (e) {
                        console.error('解析WebSocket消息失败:', e, event.data);
                    }
                };

                // 连接关闭
                socket.onclose = function(event) {
                    console.log('WebSocket连接关闭，代码:', event.code);
                    isSocketConnected = false;
                    updateWebSocketStatus(false);
                    
                    // 自动重连（非正常关闭）
                    if (event.code !== 1000 && !reconnectTimer) {
                        reconnectTimer = setTimeout(initWebSocket, 3000);
                        console.log('3秒后尝试重连...');
                    }
                };

                // 连接错误
                socket.onerror = function(error) {
                    console.error('WebSocket错误:', error);
                    updateWebSocketStatus(false);
                };
            } catch (e) {
                console.error('创建WebSocket连接失败:', e);
                updateWebSocketStatus(false);
                reconnectTimer = setTimeout(initWebSocket, 3000);
            }
        }
        // 订阅所有账号的未读更新
        function subscribeAllAccountsUnread() {
            if (!isSocketConnected) return;
            
            try {
                socket.send(JSON.stringify({
                    action: 'subscribe_all_accounts_unread',
                    timestamp: new Date().getTime(),
                    kefuid: {$kefuinfo['id']} 
                }));
                console.log('已订阅所有账号的未读更新');
            } catch (e) {
                console.error('发送订阅所有账号未读请求失败:', e);
            }
        }
        function logout() {
            // 1. 断开WebSocket连接（避免退出后仍接收消息）
            if (socket) {
                // 发送退出通知给服务器（可选，用于后端清理）
                if (isSocketConnected) {
                    socket.send(JSON.stringify({
                        action: 'logout',
                        account_id: currentAccount ? currentAccount.path : null,
                        reason: 'user主动退出'
                    }));
                }
                // 强制关闭连接
                socket.close(1000, '用户主动退出');
                socket = null;
                isSocketConnected = false;
                updateWebSocketStatus(false); // 更新连接状态UI
                
                // 清除重连计时器
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            }
        
            // 2. 调用后端退出接口
            $.post('/kefu/Login/logout', function(res) {
                if (res && res.status === 200) {
                        window.location.href =  '/kefu/login/index';
                } else {
                    // 处理退出失败情况
                    alert('退出失败：' + (res.msg || '未知错误'));
                }
            }).fail(function(xhr) {
                // 网络错误处理
                alert('退出请求失败，请重试');
                console.error('退出接口请求失败', xhr);
            });
        }
        // 更新WebSocket连接状态UI
        function updateWebSocketStatus(connected) {
            const $indicator = $('#wsStatus');
            const $text = $('#wsStatusText');
            
            if (connected) {
                $indicator.removeClass('status-offline').addClass('status-online');
                $text.text('已连接');
            } else {
                $indicator.removeClass('status-online').addClass('status-offline');
                $text.text('未连接');
            }
        }

        // 订阅账号消息
        function subscribeAccount(accountId) {
            if (!isSocketConnected) return;
            
            try {
                socket.send(JSON.stringify({
                    action: 'subscribe',
                    account_id: accountId
                }));
                
                console.log('已订阅账号:', accountId);
            } catch (e) {
                console.error('发送订阅消息失败:', e);
            }
        }

        // 处理WebSocket推送的消息
        function handleWebSocketMessage(data) {
            console.log('收到WebSocket消息:', data);
            
            switch (data.type) {
                case 'new_message':
                    // 处理新消息（当前会话的消息）
                    if (currentSession && data.session_id === currentSession.id) {
                        const msg = data.message;
                        if ($(`[data-msg-id="${msg.id}"]`).length === 0) {
                            renderMessage(msg);
                            lastMsgId = Math.max(lastMsgId, msg.id);
                            updateLastMessage(msg);
                            scrollToBottom();
                        }
                    }
                    break;

                case 'unread_update':
                    // 处理未读消息更新（跨会话）
                    updateUnreadCounts(data.updates);
                    break;

                case 'session_update':
                    // 会话列表更新（如新增会话、会话信息变更）
                    if (currentAccount && data.account_id === currentAccount.path) {
                        loadSessions(); // 重新加载会话列表
                    }
                    break;

                case 'account_status':
                    // 账号状态更新（在线/离线）
                    if (accountDataCache[data.account_id]) {
                        accountDataCache[data.account_id].connected = data.status === 'online';
                        renderAccountsList();
                    }
                    break;
                case 'account_unread_update':
                    // 处理账号级未读更新
                    if (data.account_id && typeof data.unread_count === 'number') {
                        // 更新账号缓存中的未读计数
                        if (accountDataCache[data.account_id]) {
                            accountDataCache[data.account_id].unread = data.unread_count;
                        } else {
                            // 处理新账号的未读计数
                            accountDataCache[data.account_id] = {
                                unread: data.unread_count,
                                connected: false // 默认离线，可根据实际情况调整
                            };
                        }
                        // 只更新账号列表中对应项的未读计数，不重新渲染整个列表
                        updateAccountUnreadUI(data.account_id, data.unread_count);
                    }
                    break;    
            }
        }
        // 单独更新账号的未读计数UI（不刷新整个列表）
        function updateAccountUnreadUI(accountId, unreadCount) {
            const $accountItem = $(`.account-item[data-id="${accountId}"]`);
            if ($accountItem.length) {
                const $unreadBadge = $accountItem.find('.account-unread');
                
                if (unreadCount > 0) {
                    const displayCount = unreadCount > 9999 ? '9999+' : unreadCount;
                    if ($unreadBadge.length) {
                        // 更新现有徽章
                        $unreadBadge.text(displayCount);
                    } else {
                        // 添加新徽章
                        $accountItem.find('.account-info').after(`
                            <span class="account-unread">${displayCount}</span>
                        `);
                    }
                } else if ($unreadBadge.length) {
                    // 移除徽章
                    $unreadBadge.remove();
                }
            }
        }
        // 加载所有账号
        function loadAllAccounts() {
             // 显示加载中提示
            $('#accountsList').html('<div class="p-3 text-muted">加载账号中...</div>');
            
            $.post('/kefu/Index/accountList', function(res) {
                if(res.code === 200 ) {
                    if(res.data.length > 0){
                        accounts = res.data;
                        
                        // 初始化账号缓存数据
                        accounts.forEach(account => {
                            accountDataCache[account.mtuser_id] = {
                                unread: account.unread,
                                connected: account.online,
                            };
                        });

                    // 渲染账号列表
                    renderAccountsList();
                    }else{
                        $('#accountsList').html('<div class="p-3 text-danger">无账号可以管理</div>');    
                    }
                } else {
                    console.error('加载账号列表失败:', res.msg);
                    $('#accountsList').html('<div class="p-3 text-danger">加载账号失败</div>');
                }
            }).fail(function() {
                console.error('加载账号列表网络错误');
                $('#accountsList').html('<div class="p-3 text-danger">网络错误，无法加载账号</div>');
            });
        }

        // 渲染账号列表
        function renderAccountsList() {
            const $accountsList = $('#accountsList');
            $accountsList.empty();
            
            if (accounts.length === 0) {
                $accountsList.html('<div class="p-3 text-muted">暂无账号</div>');
                return;
            }
            
            accounts.forEach(account => {
                
                const accountData = accountDataCache[account.mtuser_id] || {};
                console.log(accountData);
                const unreadHtml = accountData.unread > 0 
                    ? `<span class="account-unread">${accountData.unread > 9999 ? '9999+' : accountData.unread}</span>`
                    : '';
                const connectedClass = accountData.connected ? 'connected' : '';
                
                $accountsList.append(`
                    <div class="account-item ${currentAccount && currentAccount.path === account.mtuser_id ? 'active' : ''} ${connectedClass}" 
                         data-id="${account.mtuser_id}">
                        <div class="account-info">
                            <span class="account-name">${account.nickName || '未知账号'}</span>
                            <span class="account-number">${account.account || '无账号'}</span>
                        </div>
                        ${unreadHtml}
                    </div>
                `);
            });
            
            // 绑定账号点击事件
            $('.account-item').click(function() {
                const accountId = $(this).data('id');
                const account = accounts.find(acc => acc.mtuser_id === accountId);
                
                if (account) {
                    selectAccount(account);
                }
            });
        }

        // 选择账号
        function selectAccount(account) {
            currentAccount = {
                path: account.mtuser_id,
                id: account.mtuser_id,
                name: account.nickName || '未知账号',
                account: account.account || '无账号'
            };
            
            // 更新当前用户ID
            currentUserId = account.user_id || 'unknown';
            initCurrentUserCache();
            
            // 加载该账号的会话
            loadSessions();
            
            // 更新UI
            renderAccountsList();
            $('#chatHeader h5').text(`请选择一个会话 - ${currentAccount.name}`);
            
            // 订阅当前账号的实时消息
            if (isSocketConnected) {
                subscribeAccount(currentAccount.path);
            }
            currentSession = null
            // 重置消息区域
            resetMessageList();
        }

        // 初始化当前用户缓存
        function initCurrentUserCache() {
            if (!userInfoCache[currentUserId]) {
                userInfoCache[currentUserId] = {
                    name: '我',
                    avatar: '/assets/images/head.jpg',
                    unread: 0,
                    last_msg: ''
                };
            }
        }

        // 切换标签页
        function handleTabSwitch(e) {
          e.preventDefault();
          
          // 1. 先找到当前点击元素的父级li，再选中所有同级li中的.nav-link
          const $currentLink = $(this);
          const $allLinks = $currentLink.closest('.nav-item').siblings().find('.nav-link');
          
          // 2. 移除所有其他标签的active类，给当前标签添加active类
          $allLinks.removeClass('active');
          $currentLink.addClass('active');
          
          // 3. 切换列表显示状态（保持不变）
          const type = $currentLink.data('type');
          $(`#${type}List`).removeClass('d-none');
          const otherType = type === 'groups' ? 'friends' : 'groups';
          $(`#${otherType}List`).addClass('d-none');
        }

        // 输入框按键事件（Ctrl+Enter发送）
        function handleInputKeydown(e) {
            if(e.ctrlKey && e.keyCode === 13 && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // 消息列表滚动事件
        function handleMessageScroll() {
            if ($(this).scrollTop() <= 50 && hasMoreHistory && !isLoadingHistory && currentSession) {
                loadMoreHistory();
            }
        }

        // 加载会话列表
        function loadSessions() {
            if (!currentAccount) return;
            
            // 显示加载提示
            $('#groupsList').html('<div class="history-loading">加载会话列表中...</div>');
            $('#friendsList').html('<div class="history-loading">加载会话列表中...</div>');
            
            $.post('/kefu/Index/loadSessions', {tdata_path: currentAccount.path}, function(res) {
                if(res.code === 200) {
                    // 清空缓存
                    Object.keys(userInfoCache).forEach(key => {
                        if (key !== currentUserId) delete userInfoCache[key];
                    });
                    Object.keys(groupInfoCache).forEach(key => delete groupInfoCache[key]);
                    
                    // 缓存好友信息（私聊对象）
                    (res.data.friends || []).forEach(friend => {
                        const name = friend.first_name + (friend.last_name ? ' ' + friend.last_name : '');
                        userInfoCache[friend.user_id] = {
                            name: name || `用户${friend.user_id}`,
                            userid:friend.user_id,
                            tdata_path: currentAccount.path,
                            avatar: getSafeAvatar(friend.avatar),
                            unread: Number(friend.unread_count) || 0,
                            last_msg: truncateText(friend.last_msg || '', 20)
                        };
                    });
                    
                    // 缓存群组信息
                    (res.data.groups || []).forEach(group => {
                        groupInfoCache[group.group_id] = {
                            title: group.title || `群组${group.group_id}`,
                            group_id:group.group_id,
                            tdata_path: currentAccount.path,
                            avatar: getSafeAvatar(group.avatar),
                            unread: Number(group.unread_count) || 0,
                            last_msg: truncateText(group.last_msg || '', 20)
                        };
                    });
                    
                    // 计算当前账号总未读并更新缓存
                    calculateAccountUnread();
                    
                    // 渲染列表
                    renderGroupList();
                    renderFriendList();
                    bindSessionClick();
                } else {
                    showListError(res.msg || '加载失败，点击重试');
                }
            }).fail(function() {
                showListError('网络错误，点击重试');
            });
        }

        // 计算账号总未读
        function calculateAccountUnread() {
            if (!currentAccount) return;
            
            let totalUnread = 0;
            
            // 累加好友未读（私聊）
            Object.values(userInfoCache).forEach(user => {
                totalUnread += user.unread || 0;
            });
            
            // 累加群组未读
            Object.values(groupInfoCache).forEach(group => {
                totalUnread += group.unread || 0;
            });
            
            // 更新账号未读计数
            if (accountDataCache[currentAccount.path]) {
                accountDataCache[currentAccount.path].unread = totalUnread;
                renderAccountsList();
            }
        }

        // 显示列表加载错误
        function showListError(msg) {
            $('#groupsList').html(`<div class="history-error">${msg}</div>`);
            $('#friendsList').html(`<div class="history-error">${msg}</div>`);
            $('.history-error').click(loadSessions);
        }

        // 渲染群组列表
        function renderGroupList() {
            const $groupsList = $('#groupsList');
            $groupsList.empty();
            
            const groupIds = Object.keys(groupInfoCache);
            if (groupIds.length === 0) {
                $groupsList.html('<div class="no-history">暂无群组</div>');
                return;
            }
            
            groupIds.forEach(groupId => {
                const group = groupInfoCache[groupId];
                const unreadHtml = group.unread > 0 ? 
                    (group.unread > 9999 ? `<span class="unread-badge">9999+</span>` : `<span class="unread-badge">${group.unread}</span>`) : '';
                
                $groupsList.append(`
                    <a href="#" class="list-group-item list-group-item-action session-item" 
                       data-type="group" data-id="${groupId}" data-title="${group.title}">
                        <img class="session-avatar" src="${group.avatar}" 
                             alt="${group.title}" onerror="this.src='/assets/images/head.jpg'">
                        <div class="session-info">
                            <div class="session-title">${group.title}</div>
                            <div class="session-desc">${group.last_msg}</div>
                        </div>
                        ${unreadHtml}
                    </a>
                `);
            });
        }
        
        // 渲染好友列表（私聊对象）
        function renderFriendList() {
            const $friendsList = $('#friendsList');
            $friendsList.empty();
            
            const userIds = Object.keys(userInfoCache).filter(id => id !== currentUserId);
            if (userIds.length === 0) {
                $friendsList.html('<div class="no-history">暂无私聊对象</div>');
                return;
            }
            
            userIds.forEach(userId => {
                const friend = userInfoCache[userId];
                const unreadHtml = friend.unread > 0 ? 
                    (friend.unread > 9999 ? `<span class="unread-badge">9999+</span>` : `<span class="unread-badge">${friend.unread}</span>`) : '';
                
                $friendsList.append(`
                    <a href="#" class="list-group-item list-group-item-action session-item" 
                       data-type="friend" data-id="${userId}" data-title="${friend.name}">
                        <img class="session-avatar" src="${friend.avatar}" 
                             alt="${friend.name}" onerror="this.src='/assets/images/head.jpg'">
                        <div class="session-info">
                            <div class="session-title">${friend.name}</div>
                            <div class="session-desc">${friend.last_msg}</div>
                        </div>
                        ${unreadHtml}
                    </a>
                `);
            });
        }

        // 绑定会话点击事件
        function bindSessionClick() {
            $('#groupsList, #friendsList').off('click', '.session-item').on('click', '.session-item', function (e) {
                e.preventDefault();
                // 只在当前点击的列表容器里移除 active
                $(this).closest('ul').find('.session-item').removeClass('active');
                
                // 给当前点击的会话加上 active
                $(this).addClass('active');
                
                const sessionType = $(this).data('type');
                const sessionId = $(this).data('id');
                
                // 重置未读计数
                if (sessionType === 'group' && groupInfoCache[sessionId]) {
                    groupInfoCache[sessionId].unread = 0;
                    tdata_path=groupInfoCache[sessionId].tdata_path;
                    target_id=groupInfoCache[sessionId].group_id;
                } else if (userInfoCache[sessionId]) {
                    
                    userInfoCache[sessionId].unread = 0;
                    console.log(userInfoCache[sessionId]);
                    tdata_path=userInfoCache[sessionId].tdata_path;
                    target_id=userInfoCache[sessionId].userid;
                }
                
                $.post('/kefu/index/readmsg', {
                        tdata_path: tdata_path,
                        target_id: target_id,
                    
                    }, function(res) {
                        console.log(res);
                        
                    })
                
                
                // 更新未读计数
                calculateAccountUnread();
                renderGroupList();
                renderFriendList();
                
                // 初始化聊天会话
                currentSession = {
                    type: sessionType,
                    id: sessionId,
                    title: $(this).data('title'),
                    avatar: $(this).find('.session-avatar').attr('src')
                };
                
                // 更新聊天头部
                $('#chatHeader h5').text(`${currentSession.title} - ${currentAccount.name}`);
                
                // 加载历史消息
                resetMessageList();
                loadHistoryMessages();
            });
        }

        // 重置消息列表状态
        function resetMessageList() {
            $('#messageList').empty();
            lastMsgId = 0;
            lastLoadedOffset = 0;
            hasMoreHistory = true;
            
            //isLoadingHistory = false;
            $('#sendBtn').prop('disabled', !currentSession);
        }

        // 加载历史消息（首次加载）
        function loadHistoryMessages() {
           // if (!currentSession) return;
            if (!currentSession || !currentAccount) {
                console.warn("没有选中会话，不加载历史消息");
                return;
            }
            // 显示加载提示
            $('#messageList').html('<div class="history-loading">加载历史消息中...</div>');
            
            $.post('/kefu/Index/loadHistory', {
                tdata_path: currentAccount.path,
                target_id: currentSession.id,
                limit: 10,
                offset: 0
            }, function(res) {
                $('#messageList').empty();
                
                if(res.code === 200) {
                    const messages = res.data.messages || [];
                    if (messages.length > 0) {
                        // 按时间排序
                        messages.sort((a, b) => new Date(a.date) - new Date(b.date));
                        
                        messages.forEach(msg => {
                            renderMessage(msg);
                            lastMsgId = Math.max(lastMsgId, msg.id);
                        });
                        
                        // 更新分页信息
                        lastLoadedOffset = messages[messages.length - 1].id;
                        hasMoreHistory = res.data.has_more || false;
                        
                        // 显示加载更多提示
                        if (hasMoreHistory) {
                            $('#messageList').prepend('<div class="load-more-tip">滚动到顶部加载更多历史消息</div>');
                        }
                        
                        scrollToBottom();
                    } else {
                        $('#messageList').html('<div class="no-history">暂无历史消息</div>');
                        hasMoreHistory = false;
                    }
                } else {
                    $('#messageList').html(`<div class="history-error">${res.msg || '加载失败，点击重试'}</div>`);
                    $('.history-error').click(loadHistoryMessages);
                }
            }).fail(function() {
                $('#messageList').html('<div class="history-error">网络错误，点击重试</div>');
                $('.history-error').click(loadHistoryMessages);
            });
        }

        // 加载更多历史消息
        function loadMoreHistory() {
            if (!currentSession || !hasMoreHistory || isLoadingHistory) return;
            
            isLoadingHistory = true;
            $('#messageList').prepend('<div class="history-loading">加载更多历史消息...</div>');
            
            $.post('/kefu/index/loadHistory', {
                tdata_path: currentAccount.path,
                target_id: currentSession.id,
                limit: 10,
                offset: lastLoadedOffset
            }, function(res) {
                $('.history-loading').first().remove();
                isLoadingHistory = false;
                
                if(res.code === 200) {
                    const messages = res.data.messages || [];
                    if (messages.length > 0) {
                        // 按时间排序
                        messages.sort((a, b) => new Date(a.date) - new Date(b.date));
                        
                        // 记录滚动位置
                        const scrollHeight = $('#messageList')[0].scrollHeight;
                        
                        // 插入消息
                        messages.forEach(msg => {
                            const messageEl = createMessageElement(msg);
                            $('#messageList').prepend(messageEl);
                        });
                        
                        // 更新分页信息
                        lastLoadedOffset = messages[messages.length - 1].id;
                        hasMoreHistory = res.data.has_more || false;
                        
                        // 调整滚动位置
                        const newScrollHeight = $('#messageList')[0].scrollHeight;
                        $('#messageList').scrollTop(newScrollHeight - scrollHeight);
                    } else {
                        hasMoreHistory = false;
                        $('#messageList').prepend('<div class="load-more-tip">已加载全部历史消息</div>');
                    }
                } else {
                    $('#messageList').prepend(`<div class="history-error">${res.msg || '加载失败，点击重试'}</div>`);
                    $('.history-error').click(function() {
                        $(this).remove();
                        loadMoreHistory();
                    });
                }
            }).fail(function() {
                $('.history-loading').first().remove();
                isLoadingHistory = false;
                $('#messageList').prepend('<div class="history-error">网络错误，点击重试</div>');
                $('.history-error').click(function() {
                    $(this).remove();
                    loadMoreHistory();
                });
            });
        }

        // 创建消息元素
        function createMessageElement(msg) {
            // 判断是否为当前用户发送的消息
            const isOutgoing = msg.is_outgoing || msg.sender_id === currentUserId;
            
            // 获取发送者信息
            const senderInfo = isOutgoing ? {
                name: '我',
                avatar: userInfoCache[currentUserId]?.avatar || '/assets/images/head.jpg'
            } : (userInfoCache[msg.sender_id] || {
                name: `用户${msg.sender_id}`,
                avatar: getSafeAvatar(msg.avatar)
            });
            
            // 格式化时间为 HH:MM 格式
            const date = new Date(msg.date);
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            
            // 创建DOM元素
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            messageEl.setAttribute('data-msg-id', msg.id);
            
            // 设置消息内容
            messageEl.innerHTML = `
                <img class="message-avatar" 
                     src="${senderInfo.avatar}" 
                     alt="${senderInfo.name}" 
                     onerror="this.src='/assets/images/head.jpg'">
                <div class="message-content">
                    <span class="message-sender">${senderInfo.name}</span>
                    <div class="content">${formatMessageContent(msg)}</div>
                    <div class="message-meta">${timeStr}</div>
                </div>
            `;
            
            return messageEl;
        }

        // 渲染消息
        function renderMessage(msg) {
            const messageEl = createMessageElement(msg);
            $('#messageList').append(messageEl);
        }

        // 发送消息
        function sendMessage() {
            const $input = $('#messageInput');
            const text = $input.val().trim();
            console.log(text);
            // 验证输入和会话状态
            if (!text || !currentSession || !currentAccount) return;
            
            const $sendBtn = $('#sendBtn');
            $sendBtn.prop('disabled', true).text('发送中...');
            const originalText = text;
            
            // 创建临时消息（用于前端即时显示）
            const msgId = Date.now();
            const tempMsg = {
                id: msgId,
                text: text,
                sender_id: currentUserId,
                is_outgoing: true,
                date: new Date().toISOString()
            };
            renderMessage(tempMsg);
            scrollToBottom();
            $input.val('');
            
            // 通过WebSocket发送消息
            if (isSocketConnected) {
                try {
                    socket.send(JSON.stringify({
                        action: 'send_message',
                        account_id: currentAccount.path,
                        target_id: currentSession.id,
                        message_type: 'text',
                        message_text: text
                    }));
                    console.log(currentAccount.path);
                    // 等待服务器确认（3秒超时）
                    const confirmTimeout = setTimeout(() => {
                        $sendBtn.prop('disabled', false).text('发送');
                    }, 3000);
                    
                    // 监听发送结果（通过WebSocket返回）
                    const handleSendResult = function(event) {
                        console.log('监听器已触发，收到原始消息:', event.data);
                        try {
                            const data = JSON.parse(event.data);
                            console.log(data);
                            if (data.type === 'send_result') {
                                clearTimeout(confirmTimeout);
                                $sendBtn.prop('disabled', false).text('发送');
                                
                                if (!data.result.success) {
                                    // 发送失败：移除临时消息并恢复输入
                                    $(`[data-msg-id="${msgId}"]`).remove();
                                    $input.val(originalText);
                                    alert('发送失败: ' + (data.result.msg || '未知错误'));
                                }
                                
                                // 处理完成后移除监听器
                                socket.removeEventListener('message', handleSendResult);
                            }
                        } catch (e) {
                            console.error('处理发送结果失败:', e);
                        }
                    };
                    
                    socket.addEventListener('message', handleSendResult, { once: true });
                    console.log('handleSendResult 监听器已注册');
                } catch (e) {
                    console.error('发送消息失败:', e);
                    $sendBtn.prop('disabled', false).text('发送');
                    $(`[data-msg-id="${msgId}"]`).remove();
                    $input.val(originalText);
                    alert('发送失败，请重试');
                }
            } else {
                // 降级为HTTP发送
                $.post('/kefu/Index/sendMessage', {
                    tdata_path: currentAccount.path,
                    target_id: currentSession.id,
                    message_type: 'text',
                    message_text: text
                }, function(res) {
                    $sendBtn.prop('disabled', false).text('发送');
                    
                    if (res.code !== 200) {
                        // 发送失败：移除临时消息并恢复输入
                        $(`[data-msg-id="${msgId}"]`).remove();
                        $input.val(originalText);
                        alert('发送失败: ' + (res.msg || '未知错误'));
                    }
                }).fail(function() {
                    $sendBtn.prop('disabled', false).text('发送');
                    $(`[data-msg-id="${msgId}"]`).remove();
                    $input.val(originalText);
                    alert('发送失败，请重试');
                });
            }
        }

        // 更新会话最后一条消息预览
        function updateLastMessage(msg) {
            if (!currentSession) return;
            
            // 获取对应会话的缓存
            const cache = currentSession.type === 'group' 
                ? groupInfoCache[currentSession.id] 
                : userInfoCache[currentSession.id];
            
            if (cache) {
                // 更新最后一条消息预览（截断过长文本）
                cache.last_msg = truncateText(msg.text || '[非文本消息]', 20);
                
                // 重新渲染当前激活的标签页
                if ($('.nav-tabs a.active').data('type') === currentSession.type) {
                    currentSession.type === 'group' ? renderGroupList() : renderFriendList();
                    // 重新绑定点击事件
                    bindSessionClick();
                    // 保持当前会话的选中状态
                    $(`.session-item[data-type="${currentSession.type}"][data-id="${currentSession.id}"]`).addClass('active');
                }
            }
        }

        // 更新未读消息计数解析WebSocket消息 {"type":"unread_update","updates":{"total_unread":36,"unread_chats":[{"chat_id":-1002716666885,"title":"666","unread_count":2,"is_group":true,"is_channel":true,"is_user":false},{"chat_id":-4953789442,"title":"888","unread_count":34,"is_group":true,"is_channel":false,"is_user":false}]}}
        function updateUnreadCounts(updates) {
            let needRender = false;
            
            // 检查是否是新格式的未读更新数据
            if (updates.unread_chats && Array.isArray(updates.unread_chats)) {
                // 处理每个未读会话
                updates.unread_chats.forEach(chat => {
                    const chatId = chat.chat_id.toString();
                    const unreadCount = Number(chat.unread_count) || 0;
                    
                    // 判断是群组还是私聊
                    if (chat.is_group || chat.is_channel) {
                        // 处理群组会话
                        if (groupInfoCache[chatId] !== undefined) {
                            if (groupInfoCache[chatId].unread !== unreadCount) {
                                groupInfoCache[chatId].unread = unreadCount;
                                needRender = true;
                            }
                        }
                    } else if (chat.is_user) {
                        // 处理私聊会话
                        if (userInfoCache[chatId] !== undefined) {
                            if (userInfoCache[chatId].unread !== unreadCount) {
                                userInfoCache[chatId].unread = unreadCount;
                                needRender = true;
                            }
                        }
                    }
                });
                
                // 更新账号总未读计数
                if (currentAccount && updates.total_unread !== undefined) {
                    accountDataCache[currentAccount.path].unread = Number(updates.total_unread) || 0;
                    needRender = true;
                }
            } else if (Array.isArray(updates)) {
                // 兼容旧格式的处理
                updates.forEach(update => {
                    if (update.type === 'group' && groupInfoCache[update.id]) {
                        const newUnread = Number(update.unread) || 0;
                        if (groupInfoCache[update.id].unread !== newUnread) {
                            groupInfoCache[update.id].unread = newUnread;
                            needRender = true;
                        }
                    } else if (update.type === 'friend' && userInfoCache[update.id]) {
                        const newUnread = Number(update.unread) || 0;
                        if (userInfoCache[update.id].unread !== newUnread) {
                            userInfoCache[update.id].unread = newUnread;
                            needRender = true;
                        }
                    }
                });
            }
            
            // 更新UI
            if (needRender) {
                renderAccountsList(); // 更新账号列表的未读数字
                
                const activeType = $('.nav-tabs a.active').data('type');
                activeType === 'groups' ? renderGroupList() : renderFriendList();
                bindSessionClick(); // 重新绑定会话点击事件
            }
        }

        // 安全处理头像URL
        function getSafeAvatar(avatarUrl) {
            if (!avatarUrl) return '/assets/images/head.jpg';
            if (avatarUrl.startsWith('http') || avatarUrl.startsWith('data:image/')) {
                return avatarUrl;
            }
            return '/assets/images/head.jpg';
        }

        // 格式化消息内容
        function formatMessageContent(msg) {
            if (!msg.text) return '[无内容]';
            
            // 转换链接为可点击的a标签
            let content = msg.text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
            // 转换换行符为br标签
            content = content.replace(/\n/g, '<br>');
            
            return content;
        }

        // 截断长文本
        function truncateText(text, maxLength) {
            if (typeof text !== 'string') return '';
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        // 滚动消息列表到底部
        function scrollToBottom() {
            const $list = $('#messageList');
            $list.scrollTop($list[0].scrollHeight);
        }
    </script>
</body>
</html>
