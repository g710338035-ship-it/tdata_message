{extend name='common/container'}
{block name="content"}
<div style="margin:0 15px 15px 15px;">
<el-card shadow="never" style="min-height:650px;">
<div v-if="search_visible" id="search" class="search">
	<el-form ref="form" size="small" :model="searchData" inline>
		<el-form-item label="用户名">
			<el-input id="username" v-model="searchData.username"  style="width:150px;" placeholder="请输入用户名"></el-input>
		</el-form-item>
		
		<el-form-item label="状态">
			<el-select style="width:150px" v-model="searchData.status" filterable clearable placeholder="请选择">
				<el-option key="0" label="开启" value="1"></el-option>
				<el-option key="1" label="关闭" value="0"></el-option>
			</el-select>
		</el-form-item>

		<search-tool :search_data.sync="searchData" @refesh_list="index"></search-tool>
	</el-form>
</div>
<div class="btn-group" style="margin-top:10px;margin-bottom:10px;">
	<div>
		<el-button v-for="item in button_group" :key="item.access" v-if="checkPermission(item.access,'{:implode(',',session('admin.access'))}','{:session('admin.role_id')}',[1])" :disabled="$data[item.disabled]" :type="item.color" size="mini" :icon="item.icon" @click="fn(item.clickname)">
			<span v-if="item.batch" v-text="$data['batchUpdateStatus']?'批量保存':'批量编辑'"></span>
			<span v-else v-text="item.name"></span>
		</el-button>
	</div>
	<div><table-tool :search_visible.sync="search_visible"  @refesh_list="index"></table-tool></div>
</div>
<el-table :row-class-name="rowClass" @selection-change="selection"  @row-click="handleRowClick"  row-key="id"  :header-cell-style="{ background: '#eef1f6', color: '#606266' }" v-loading="loading"  ref="multipleTable" border class="eltable" :data="list"  style="width: 100%">
	<el-table-column align="center" type="selection" width="42"></el-table-column>
	<el-table-column align="center"  property="username" label="用户名" show-overflow-tooltip >	</el-table-column>
	<el-table-column align="center"  property="nickname" label="昵称" show-overflow-tooltip >	</el-table-column>
	
    <el-table-column align="center" property="accoutnum" label="tdata账号" show-overflow-tooltip width="180">
        <template slot-scope="scope">
            <div style="display: flex; flex-direction: column; align-items: center; padding: 5px 0;">
                <div style="font-weight: bold; color: #409EFF; margin-bottom: 3px;">
                    总数：{{scope.row.accoutnum || 0}}
                </div>
                <div v-if="scope.row.status_stats" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 3px;">
                    <el-tag 
                        v-for="(count, status) in scope.row.status_stats" 
                        :key="status"
                        :type="getTagType(status)"
                        size="mini"
                        style="margin: 1px;">
                        {{status}}({{count}})
                    </el-tag>
                </div>
                <div v-else style="font-size: 12px; color: #C0C4CC;">
                    暂无账号
                </div>
            </div>
        </template>
    </el-table-column>

	<el-table-column align="center"  property="Adminuser.name" label="管理员" show-overflow-tooltip >
	    <template slot-scope="scope">
			<span v-if="scope.row.Adminuser">{{scope.row.Adminuser.name}}</span>
			<span v-else>通用</span>
		</template>
	</el-table-column>

    <el-table-column align="center"  property="status" label="状态" show-overflow-tooltip width="80">
		<template slot-scope="scope">
			
			<el-switch @change="updateExt(scope.row,'status')" :active-value="1" :inactive-value="0" v-model="scope.row.status"></el-switch>
		</template>
	</el-table-column>
	<el-table-column align="center"  property="addtime" label="创建时间" show-overflow-tooltip width="">
		<template slot-scope="scope">
			{{parseTime(scope.row.addtime,'{y}-{m}-{d}')}}
		</template>
	</el-table-column>
	<el-table-column :fixed="ismobile()?false:'right'" label="操作" align="center"  width="360">
		<template slot-scope="scope">
			<div v-if="scope.row.id">
			    <el-button v-if="checkPermission('/admin/Mtcustomer/update.html','{:implode(",",session("admin.access"))}','{:session("admin.role_id")}',[1])" size="mini"  type="primary" @click="update(scope.row)" >修改密码</el-button>
			   
				<el-button v-if="checkPermission('/admin/Mtcustomer/delete.html','{:implode(",",session("admin.access"))}','{:session("admin.role_id")}',[1])" size="mini" icon="el-icon-delete" type="danger" @click="del(scope.row)" >删除</el-button>

			</div>
		</template>
	</el-table-column>
</el-table>
<Page :total="page_data.total" :page.sync="page_data.page" :limit.sync="page_data.limit" @pagination="index" />
</el-card>
<!--添加-->
<Add :show.sync="dialog.addDialogStatus" size="small" @refesh_list="index"></Add>
<!--修改-->
<Update :info="updateInfo" :show.sync="dialog.updateDialogStatus" size="small" @refesh_list="index"></Update>

<!--修改-->
<Codeinfo :info="codeInfo" :show.sync="dialog.codeStatus" size="small" @refesh_list="index"></Codeinfo>

</div>
{/block}
{block name="script"}
<script src="__PUBLIC__/assets/js/app.js"></script>
<script src="__PUBLIC__/assets/libs/xlsx/xlsx.core.min.js"></script>
<script src="__PUBLIC__/components/admin/mtcustomer/add.js?v=<?php echo rand(1000,9999)?>"></script>
<script src="__PUBLIC__/components/admin/mtcustomer/update.js?v=<?php echo rand(1000,9999)?>"></script>
<script src="__PUBLIC__/components/admin/mtcustomer/detail.js?v=<?php echo rand(1000,9999)?>"></script>
<script src="__PUBLIC__/components/admin/mtcustomer/codeinfo.js?v=<?php echo rand(1000,9999)?>"></script>
<script>
new Vue({
	el: '#app',
	components:{
	},
	data: function() {
		return {
			dialog: {
				addDialogStatus : false,
				updateDialogStatus : false,
				detailDialogStatus : false,	
				codeStatus:false
			},
			searchData:{},
			button_group:[
				{name:'添加',color:'success',access:'/admin/Mtcustomer/add.html',icon:'el-icon-plus',disabled:'',clickname:'add'},
			],
			loading: false,
			page_data: {
				limit: 20,
				page: 1,
				total:20,
			},
			ids: [],
			single:true,
			multiple:true,
			search_visible:true,
			list: [],
			updateInfo:{},	
			codeInfo:{},
			exceldata:[],
			dumppage:1,
			ws:{},
			dumpshow:false,
			percentage:0,
			filename:'',
		}
	},
	methods:{
	    getTagType(status) {
        switch(status) {
            case '正常': return 'success';
            case '冻结': return 'danger';
            case '封号': return 'warning';
            case '异常': return 'info';
            case '空号': return 'warning';
            case '退出': return 'warning';
            case '注销': return 'info';
            case '未授权': return 'info';
            case '代理异常': return 'warning';
            default: return 'info';
        }
    },
		index(){
			let param = {limit:this.page_data.limit,page:this.page_data.page}
			Object.assign(param, this.searchData)
			this.loading = true
			axios.post(base_url + '/Mtcustomer/index',param).then(res => {
				if(res.data.status == 200){
					this.list = res.data.data.data
					this.page_data.total = res.data.data.total
					this.loading = false
				}else{
					this.$message.error(res.data.msg);
				}
			})
		},
		updateExt(row,field){
			if(row.id){
				axios.post(base_url + '/Mtcustomer/updateExt',{id:row.id,[field]:row[field]}).then(res => {
					if(res.data.status == 200){
						this.$message({message: res.data.msg, type: 'success'})
					}else{
						this.$message.error(res.data.msg)
					}
				})
			}
		},
		add(){
			this.dialog.addDialogStatus = true
		},
	
		monitorlogin(row){
		    
			let id = row.id ? row.id : this.ids.join(',')
		    this.loading = true
			axios.post(base_url + '/Mtcustomer/sendCode',{id:id}).then(res => {
			    console.log(res.data);
				if(res.data.status == 200){
    				this.dialog.codeStatus = true
					this.codeInfo = res.data.data
					this.loading = false
				}else{
					this.$message.error(res.data.msg)
					this.loading = false
				}
			})
		},
		monitorstarthook(row){
			let id = row.id ? row.id : this.ids.join(',')
		    this.loading = true
			axios.post(base_url + '/Mtcustomer/monitorstarthook',{id:id}).then(res => {
			    console.log(res.data);
				if(res.data.status == 200){
					
					this.$message({message: res.data.msg, type: 'success'})
					this.loading = false
					this.index()
					
				}else{
					this.$message.error(res.data.msg)
					this.loading = false
				}
			})
		},
		monitorlogout(row){
			let id = row.id ? row.id : this.ids.join(',')
		    this.loading = true
			axios.post(base_url + '/Mtcustomer/monitorlogout',{id:id}).then(res => {
			    console.log(res.data);
				if(res.data.status == 200){
					
					this.$message({message: res.data.msg, type: 'success'})
					this.loading = false
					this.index()
					
				}else{
					this.$message.error(res.data.msg)
					this.loading = false
				}
			})
		},
		update(row){
			let id = row.id ? row.id : this.ids.join(',')
		
			axios.post(base_url + '/Mtcustomer/getUpdateInfo',{id:id}).then(res => {
				if(res.data.status == 200){
					this.dialog.updateDialogStatus = true
					this.updateInfo = res.data.data
				}else{
					this.$message.error(res.data.msg)
				}
			})
		},
		del(row){
			this.$confirm('确定操作吗?', '提示', {
				confirmButtonText: '确定',
				cancelButtonText: '取消',
				type: 'warning'
			}).then(() => {
				let ids = row.id ? row.id : this.ids.join(',')
				axios.post(base_url + '/Mtcustomer/delete',{id:ids}).then(res => {
					if(res.data.status == 200){
						this.$message({message: res.data.msg, type: 'success'})
						this.index()
					}else{
						this.$message({message: res.data.msg, type: 'success'})
						this.index()
					}
				})
			}).catch(() => {})
		},
		detail(row){
			this.dialog.detailDialogStatus = true
			this.detailInfo = {id:row.id ? row.id : this.ids.join(',')}
		},
		
		forbidden(row){
			this.$confirm('确定操作吗?', '提示', {
				confirmButtonText: '确定',
				cancelButtonText: '取消',
				type: 'warning'
			}).then(() => {
				let ids = row.id ? row.id : this.ids.join(',')
				axios.post(base_url + '/Mtcustomer/forbidden',{id:ids}).then(res => {
					if(res.data.status == 200){
						this.$message({message: res.data.msg, type: 'success'})
						this.index()
					}else{
						this.$message.error(res.data.msg)
					}
				})
			}).catch(() => {})
		},
	
		selection(selection) {
			this.ids = selection.map(item => item.membe_id)
			this.single = selection.length != 1
			this.multiple = !selection.length
		},
		handleRowClick(row, rowIndex,event){
			if(event.target.className !== 'el-input__inner'){
				this.$refs.multipleTable.toggleRowSelection(row)
			}
		},
		rowClass ({ row, rowIndex }) {
			for(let i=0;i<this.ids.length;i++) {
				if (row.membe_id === this.ids[i]) {
					return 'rowLight'
				}
			}
		},
		fn(method){
			this[method](this.ids)
		},
	},
	mounted(){
		this.index()
	},
})
</script>
{/block}
